name: Windows Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Run verification and build without publishing"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  build:
    name: Build Windows executable
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249

      - name: Identify Rust compiler
        id: rust-version
        shell: pwsh
        run: |
          $version = rustc --version
          if ($LASTEXITCODE -ne 0) { throw "Could not identify Rust compiler." }
          "version=$($version -replace '[^a-zA-Z0-9.-]', '-')" >> $env:GITHUB_OUTPUT

      - name: Cache Rust dependencies and build outputs
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/registry/src
            ~/.cargo/git/db
            target/debug
            target/release
            !target/**/incremental
          key: rust-v2-${{ github.repository }}-${{ runner.os }}-${{ runner.arch }}-${{ steps.rust-version.outputs.version }}-${{ hashFiles('Cargo.lock') }}-${{ hashFiles('Cargo.toml', 'build.rs', 'tauri.conf.json', 'src/**', 'frontend/**', 'icons/**', 'capabilities/**', 'permissions/**', 'tests/usage-color-cases.json') }}
          restore-keys: |
            rust-v2-${{ github.repository }}-${{ runner.os }}-${{ runner.arch }}-${{ steps.rust-version.outputs.version }}-${{ hashFiles('Cargo.lock') }}-

      - name: Set up Node.js 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Verify version and release notes
        run: node scripts/verify-release-metadata.mjs

      - name: Install frontend test dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npm run install-browsers

      - name: Check Rust formatting
        run: cargo fmt --all -- --check

      - name: Run Rust tests
        run: cargo test --locked

      - name: Check frontend JavaScript syntax
        run: |
          node --check frontend/app.js
          node --check frontend/usage-colors.js
          node --check frontend/sound-alerts.js

      - name: Run Playwright UI tests
        run: npm test

      - name: Verify tag matches the app version
        if: github.event_name == 'push'
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $metadataJson = cargo metadata --locked --no-deps --format-version 1
          if ($LASTEXITCODE -ne 0) {
            throw "Cargo metadata validation failed."
          }
          $metadata = $metadataJson | ConvertFrom-Json
          $manifestVersion = ($metadata.packages | Where-Object { $_.name -eq "wimu" }).version
          $appVersion = (Get-Content -Raw tauri.conf.json | ConvertFrom-Json).version
          if ($manifestVersion -ne $appVersion) {
            throw "Cargo.toml version $manifestVersion does not match tauri.conf.json version $appVersion."
          }
          if ($env:RELEASE_TAG -ne "v$appVersion") {
            throw "Release tag $($env:RELEASE_TAG) does not match app version v$appVersion."
          }

      - name: Cache Tauri CLI 2.12.2
        id: tauri-cli-cache
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: ${{ runner.tool_cache }}/tauri-cli/2.12.2
          key: tauri-cli-v1-${{ runner.os }}-${{ runner.arch }}-2.12.2

      - name: Install Tauri CLI
        if: steps.tauri-cli-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: cargo install tauri-cli --version "=2.12.2" --locked --root "${{ runner.tool_cache }}/tauri-cli/2.12.2"

      - name: Add Tauri CLI to PATH
        shell: pwsh
        run: '"${{ runner.tool_cache }}/tauri-cli/2.12.2/bin" >> $env:GITHUB_PATH'

      - name: Verify Tauri CLI version
        shell: pwsh
        run: |
          $version = cargo tauri --version
          if ($LASTEXITCODE -ne 0 -or $version.Trim() -ne 'tauri-cli 2.12.2') {
            throw "Expected Tauri CLI 2.12.2, got: $version"
          }

      - name: Build executable without installer
        run: cargo tauri build --no-bundle

      - name: Stage executable and checksum
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $executablePath = "target\release\wimu.exe"
          if (-not (Test-Path -LiteralPath $executablePath -PathType Leaf)) {
            throw "The Windows executable was not produced."
          }
          New-Item -ItemType Directory -Path "release-assets" | Out-Null
          $productName = (Get-Content -Raw tauri.conf.json | ConvertFrom-Json).productName
          $appVersion = (Get-Content -Raw tauri.conf.json | ConvertFrom-Json).version
          $tag = if ($env:RELEASE_TAG -like 'v*') { $env:RELEASE_TAG } else { "v$appVersion" }
          $executableName = "$productName-$tag-windows-x64.exe"
          $stagedExecutablePath = Join-Path "release-assets" $executableName
          Copy-Item -LiteralPath $executablePath -Destination $stagedExecutablePath
          $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $stagedExecutablePath).Hash.ToLowerInvariant()
          "$hash  $executableName" | Set-Content -LiteralPath "$stagedExecutablePath.sha256" -Encoding ascii

      - name: Upload release assets
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: windows-release-assets
          path: release-assets/*
          if-no-files-found: error
          retention-days: 1

  draft-release:
    name: Create or update draft release
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && !inputs.dry_run)
    needs: build
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Download release assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: windows-release-assets
          path: release-assets

      - name: Create or update draft release
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $repositoryParts = $env:GITHUB_REPOSITORY.Split('/')
          $owner = $repositoryParts[0]
          $repository = $repositoryParts[1]
          $api = "https://api.github.com/repos/$owner/$repository"
          $appVersion = (Get-Content -Raw tauri.conf.json | ConvertFrom-Json).version
          $tag = if ($env:RELEASE_TAG -like 'v*') { $env:RELEASE_TAG } else { "v$appVersion" }
          $releaseNotesPath = Join-Path ".github/release-notes" "$tag.md"
          if (-not (Test-Path -LiteralPath $releaseNotesPath -PathType Leaf)) {
            throw "Curated release notes not found: $releaseNotesPath"
          }
          $releaseBody = Get-Content -Raw -LiteralPath $releaseNotesPath -Encoding utf8
          $productName = (Get-Content -Raw tauri.conf.json | ConvertFrom-Json).productName
          $headers = @{
            Authorization = "Bearer $env:GITHUB_TOKEN"
            Accept = "application/vnd.github+json"
            "X-GitHub-Api-Version" = "2026-03-10"
          }

          $release = $null
          try {
            $release = Invoke-RestMethod -Method Get -Uri "$api/releases/tags/$tag" -Headers $headers
          } catch {
            if ([int]$_.Exception.Response.StatusCode -ne 404) {
              throw
            }
          }

          if ($null -eq $release) {
            $payload = @{
              tag_name = $tag
              name = "$productName $tag"
              body = $releaseBody
              draft = $true
              prerelease = $false
              generate_release_notes = $false
            } | ConvertTo-Json
            $release = Invoke-RestMethod -Method Post -Uri "$api/releases" -Headers $headers -ContentType "application/json" -Body $payload
          } elseif (-not $release.draft) {
            throw "Release $tag is already published; refusing to replace its assets."
          } else {
            $payload = @{
              name = "$productName $tag"
              body = $releaseBody
            } | ConvertTo-Json
            $release = Invoke-RestMethod -Method Patch -Uri "$api/releases/$($release.id)" -Headers $headers -ContentType "application/json" -Body $payload
          }

          $assetFiles = @(Get-ChildItem "release-assets" -File)
          $assetNames = @($assetFiles | ForEach-Object { $_.Name })
          foreach ($asset in $release.assets) {
            if ($assetNames -contains $asset.name) {
              Invoke-RestMethod -Method Delete -Uri "$api/releases/assets/$($asset.id)" -Headers $headers | Out-Null
            }
          }

          foreach ($assetFile in $assetFiles) {
            $encodedName = [Uri]::EscapeDataString($assetFile.Name)
            $uploadUri = "https://uploads.github.com/repos/$owner/$repository/releases/$($release.id)/assets?name=$encodedName"
            Invoke-RestMethod -Method Post -Uri $uploadUri -Headers $headers -ContentType "application/octet-stream" -InFile $assetFile.FullName | Out-Null
          }
