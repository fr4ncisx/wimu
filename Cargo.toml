[package]
name = "wimu"
version = "0.5.2"
description = "WIMU desktop panel for Codex CLI usage limits"
authors = ["WIMU contributors"]
edition = "2021"
rust-version = "1.78"

[lib]
name = "wimu_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["arbitrary_precision"] }
tauri = { version = "2", default-features = false, features = ["tray-icon", "wry", "common-controls-v6", "dynamic-acl"] }
tauri-plugin-single-instance = "2.5.3"
